services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-experimento
    restart: unless-stopped
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./scripts:/freqtrade/scripts"
    # El puerto de la API/FreqUI queda comentado por ahora: no lo necesitamos
    # para descargar datos ni para backtesting. Lo activaremos, atado solo a
    # localhost, si en Fase 3 queremos un panel web además de Telegram.
    # ports:
    #   - "127.0.0.1:8080:8080"

    # En Fase 1 este servicio se usa SOLO para comandos puntuales con
    # "docker compose run --rm freqtrade <comando>" (create-userdir,
    # download-data, backtesting...). Por eso no definimos aquí un
    # "command:" de arranque todavía: eso lo añadiremos en Fase 3, cuando
    # pongamos el bot a correr en modo dry-run de forma continua con
    # "docker compose up -d".
